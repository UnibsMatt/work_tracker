services:
  app:
    build: .
    container_name: work-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/shifts.db
    ports:
      - "3333:3000"
    volumes:
      - ./data:/app/data   # SQLite database lives here on the host

  # optional Cloudflare tunnel: docker compose --profile tunnel up -d
  # (needs CLOUDFLARE_TUNNEL_TOKEN in .env, public hostname -> http://app:3000)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
